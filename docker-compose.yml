services:
  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: monolito
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    networks:
      - red2

  backend:
    build: ./app_backend
    container_name: app_backend
    ports:
      - "3007:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: monolito
      DB_USER: postgres
      DB_PASSWORD: 1234
    depends_on:
      - db
    networks:
      - red2

  frontend:
    build: ./app_frontend
    container_name: app_frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - red2

networks:
  red2:
    driver: bridge

volumes:
  datos_postgres:
    driver: local
